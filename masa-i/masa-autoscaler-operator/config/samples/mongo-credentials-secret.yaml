---
# MongoDB credentials secret
# Create this secret before deploying the CR:
#
#   oc create secret generic mongo-credentials \
#     --from-literal=username=<MONGO_USERNAME> \
#     --from-literal=password=<MONGO_PASSWORD> \
#     -n <NAMESPACE>
#
# The operator mounts this secret at /etc/secrets/mongo inside each container
# that needs MongoDB access. The Python code reads username/password files
# from that directory, with a fallback to MONGO_USERNAME / MONGO_PASSWORD env vars.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: system  # replaced by kustomize with the actual namespace
type: Opaque
stringData:
  username: CHANGEME
  password: CHANGEME
