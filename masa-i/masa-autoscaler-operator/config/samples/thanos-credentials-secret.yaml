---
# Thanos / Prometheus authentication — projected ServiceAccount token
#
# Instead of a static oc-whoami token (which expires), we project a
# short-lived ServiceAccount token that Kubernetes rotates automatically.
#
# The volume below mounts the token at /etc/secrets/thanos/token inside the
# data-monitoring container.  The Python code reads that file with its
# _read_secret_file() helper, falling back to the THANOS_TOKEN env var.
#
# RBAC prerequisite: grant the controller-manager ServiceAccount the
# cluster-monitoring-view ClusterRole so it can query Thanos:
#
#   oc adm policy add-cluster-role-to-user cluster-monitoring-view \
#     -z controller-manager -n <NAMESPACE>
#
# No Secret object needs to be created manually — the projected volume
# is defined directly in the pod template (see tasks/main.yml).
#
# If you still prefer a static token (e.g. for quick local testing), create:
#
#   oc create secret generic thanos-credentials \
#     --from-literal=token=$(oc whoami --show-token) \
#     -n <NAMESPACE>
#
# and switch the volume in tasks/main.yml back to:
#   volumes:
#   - name: thanos-credentials
#     secret:
#       secretName: thanos-credentials
