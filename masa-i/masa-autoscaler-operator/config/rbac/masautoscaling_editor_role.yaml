# permissions for end users to edit masautoscalings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: masautoscaling-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: masa-autoscaler-operator
    app.kubernetes.io/part-of: masa-autoscaler-operator
    app.kubernetes.io/managed-by: kustomize
  name: masautoscaling-editor-role
rules:
- apiGroups:
  - scaling.masa.com
  resources:
  - masautoscalings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scaling.masa.com
  resources:
  - masautoscalings/status
  verbs:
  - get
