---
# ---------------------------------------------------------------------------
# Thanos URL auto-discovery
# ---------------------------------------------------------------------------
# If spec.thanosUrl is set in the CR, that value is used as-is (bypass mode).
# Otherwise we query the OpenShift Route in openshift-monitoring to build
# the URL automatically, falling back to the in-cluster Thanos service address.

- name: Auto-discover Thanos route when thanosUrl is not set
  when: thanos_url is not defined or thanos_url == ""
  block:
    - name: Get Thanos Querier route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: openshift-monitoring
        label_selectors:
          - "app.kubernetes.io/name=thanos-querier"
      register: thanos_route_info
      ignore_errors: true

    - name: Set thanos_url from discovered route
      set_fact:
        thanos_url: "https://{{ thanos_route_info.resources[0].spec.host }}/api/v1/query"
      when:
        - thanos_route_info.resources is defined
        - thanos_route_info.resources | length > 0

    - name: Fall back to in-cluster Thanos service URL when route not found
      set_fact:
        # In-cluster address – no external route needed, lower latency, avoids TLS SNI issues.
        # Port 9091 requires cluster-monitoring-view ClusterRole on the ServiceAccount.
        thanos_url: "https://thanos-querier.openshift-monitoring.svc:9091/api/v1/query"
      when: thanos_url is not defined or thanos_url == ""

- name: Log resolved Thanos URL
  debug:
    msg: "Using Thanos URL: {{ thanos_url }}"

# ---------------------------------------------------------------------------
# understanding-agent Job (runs on-demand whenever the CR spec changes or is created)
# ---------------------------------------------------------------------------
# Instead of polling via a 1-minute CronJob, the understanding agent runs as a
# one-shot K8s Job during operator reconciliation. A spec-hash suffix ensures a
# new Job is triggered only when CR configuration/intent actually changes.

- name: Clean up legacy understanding-agent CronJob if present
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: CronJob
    name: '{{ ansible_operator_meta.name }}-understanding-agent'
    namespace: '{{ ansible_operator_meta.namespace }}'
  ignore_errors: true

- name: Compute CR spec hash
  set_fact:
    cr_spec_hash: "{{ _scaling_masa_com_msagenticscaling.spec | default({}) | string | hash('sha256') | truncate(10, True, '') }}"

- name: Deploy understanding-agent Job
  kubernetes.core.k8s:
    definition:
      kind: Job
      apiVersion: batch/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-understanding-agent-{{ cr_spec_hash }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
        labels:
          app: masa-understanding-agent
      spec:
        ttlSecondsAfterFinished: 600
        backoffLimit: 3
        template:
          metadata:
            labels:
              app: masa-understanding-agent
          spec:
            serviceAccountName: masa-controller-manager
            restartPolicy: OnFailure
            containers:
            - name: masa-understanding-agent
              image: "jpksn/masa-agent-understanding:1.0.1"   # masa-agent-understanding/docker
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              env:
                - name: OPERATOR_NAMESPACE
                  value: '{{ ansible_operator_meta.namespace }}'
                - name: CR_NAME
                  value: '{{ ansible_operator_meta.name }}'
                - name: MONGO_HOST
                  value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                - name: MONGO_TLS
                  value: "true"
                - name: MONGO_TLS_INSECURE
                  value: "true"
                - name: MONGO_SECRET_DIR
                  value: "/etc/secrets/mongo"
              volumeMounts:
                - name: mongo-credentials
                  mountPath: /etc/secrets/mongo
                  readOnly: true
            volumes:
              - name: mongo-credentials
                secret:
                  secretName: mongo-credentials

# ---------------------------------------------------------------------------
# Persistent storage for ML model artefacts
# ---------------------------------------------------------------------------
# StorageClass resolution order:
#   1. spec.storageClassName in the CR  (explicit override)
#   2. Auto-discover: first StorageClass whose provisioner matches a known
#      ReadWriteMany-capable filesystem provisioner
#   3. Omit storageClassName → cluster default StorageClass is used

- name: List all StorageClasses in the cluster
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: storage_classes_info
  when: storage_class_name is not defined or storage_class_name == ""
  ignore_errors: true

- name: Auto-detect RWX filesystem StorageClass
  set_fact:
    storage_class_name: >-
      {{ (storage_classes_info.resources
          | default([])
          | selectattr('provisioner', 'search',
              'cephfs|nfs|azurefile|efs|filestore|csi-nfs|smb')
          | map(attribute='metadata.name')
          | list
          | first
          | default('')) }}
  when:
    - storage_class_name is not defined or storage_class_name == ""
    - storage_classes_info.resources is defined

- name: Log resolved StorageClass
  debug:
    msg: >-
      Using StorageClass: {{ storage_class_name | default('(cluster default)') }}

- name: Build PVC spec (conditionally include storageClassName)
  set_fact:
    _pvc_spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: "{{ model_pvc_size | default('500Mi') }}"
      volumeMode: Filesystem

- name: Add storageClassName to PVC spec when one was resolved
  set_fact:
    _pvc_spec: "{{ _pvc_spec | combine({'storageClassName': storage_class_name}) }}"
  when: (storage_class_name | default('')) != ''

- name: Create PVC for model storage
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: model-pvc
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec: "{{ _pvc_spec }}"

# ---------------------------------------------------------------------------
# perception-agent Deployment (long-running; samples Thanos every MONITOR_INTERVAL_SECONDS)
# ---------------------------------------------------------------------------

- name: Deploying perception-agent
  kubernetes.core.k8s:
    definition:
      kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-perception-agent'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: masa-agent-perception
        template:
          metadata:
            labels:
              app: masa-agent-perception
          spec:
            serviceAccountName: masa-controller-manager
            containers:
            - name: masa-agent-perception
              image: "jpksn/masa-agent-perception:1.0.1"      # masa-agent-perception/docker
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
              env:
                - name: MONGO_HOST
                  value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                - name: MONGO_TLS
                  value: "true"
                - name: MONGO_TLS_INSECURE
                  value: "true"
                - name: MONGO_SECRET_DIR
                  value: "/etc/secrets/mongo"
                - name: THANOS_SECRET_DIR
                  value: "/etc/secrets/thanos"
                - name: THANOS_URL
                  value: "{{ thanos_url }}"
                - name: NAMESPACE
                  value: "{{ microservice_namespace | default(ansible_operator_meta.namespace) }}"
                - name: DEPLOYMENT
                  value: "{{ microservice_deployment | default('iotoccupancy-sample-mosquitto') }}"
                - name: T_QUANTILE
                  value: "{{ target_quantile | default('0.5') }}"
                - name: T_MESSAGE_DELIVERED_PERCENTAGE
                  value: "{{ target_message_delivered_percentage | default('95') }}"
                - name: MONITOR_INTERVAL_SECONDS
                  value: "{{ data_monitoring_interval | default('15') }}"
              volumeMounts:
                - name: mongo-credentials
                  mountPath: /etc/secrets/mongo
                  readOnly: true
                - name: thanos-token
                  mountPath: /etc/secrets/thanos
                  readOnly: true
            volumes:
              - name: mongo-credentials
                secret:
                  secretName: mongo-credentials
              - name: thanos-token
                projected:
                  sources:
                    - serviceAccountToken:
                        path: token
                        expirationSeconds: 3600
                        audience: https://kubernetes.default.svc

# ---------------------------------------------------------------------------
# action-agent Deployment (polls MongoDB for plans and applies K8s scaling)
# ---------------------------------------------------------------------------

- name: Deploying action-agent
  kubernetes.core.k8s:
    definition:
      kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-action-agent'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        replicas: "{{ size }}"
        selector:
          matchLabels:
            app: masa-agent-action
        template:
          metadata:
            labels:
              app: masa-agent-action
          spec:
            serviceAccountName: masa-controller-manager
            containers:
            - name: masa-agent-action
              image: "jpksn/masa-agent-action:1.0.1"              # masa-agent-action/docker
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
              env:
                - name: NAMESPACE
                  value: "{{ microservice_namespace | default(ansible_operator_meta.namespace) }}"
                - name: DEPLOYMENT_NAME
                  value: "{{ microservice_deployment | default('iotoccupancy-sample-mosquitto') }}"
                - name: MONGO_HOST
                  value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                - name: MONGO_TLS
                  value: "true"
                - name: MONGO_TLS_INSECURE
                  value: "true"
                - name: MONGO_SECRET_DIR
                  value: "/etc/secrets/mongo"
                # How many seconds to wait between polls when no plan is pending
                - name: POLL_INTERVAL_SECONDS
                  value: "10"
                # Hard limits on replica count (safety clamp)
                - name: MIN_REPLICAS
                  value: "{{ min_replicas | default('1') }}"
                - name: MAX_REPLICAS
                  value: "{{ max_replicas | default('20') }}"
              volumeMounts:
                - name: mongo-credentials
                  mountPath: /etc/secrets/mongo
                  readOnly: true
            volumes:
              - name: mongo-credentials
                secret:
                  secretName: mongo-credentials

# ---------------------------------------------------------------------------
# planning-training CronJob (runs every 30 minutes, concurrencyPolicy: Forbid)
# ---------------------------------------------------------------------------

- name: Deploying planning-training CronJob
  kubernetes.core.k8s:
    definition:
      kind: CronJob
      apiVersion: batch/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-planning-training'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        # Retrain every 30 minutes. Adjust via spec.modelTrainingSchedule in the CR.
        schedule: "{{ model_training_schedule | default('*/30 * * * *') }}"
        # Suspended until spec.trainingEnabled is set to true in the CR.
        # This lets the operator collect enough data before training begins.
        suspend: "{{ not (training_enabled | default(false) | bool) }}"
        # Never run two training jobs simultaneously – training is CPU/memory intensive.
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 5
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            template:
              metadata:
                labels:
                  app: masa-agent-planning-training
              spec:
                serviceAccountName: masa-controller-manager
                # Never auto-restart a failed training job mid-run.
                # Let it fail cleanly and wait for the next scheduled tick.
                restartPolicy: Never
                containers:
                - name: masa-agent-planning-training
                  image: "jpksn/masa-agent-planning-training:1.0.2"  # masa-agent-planning/docker-training
                  imagePullPolicy: IfNotPresent
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "512Mi"
                    limits:
                      cpu: "2000m"
                      memory: "2Gi"
                  env:
                    - name: MONGO_HOST
                      value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                    - name: MONGO_TLS
                      value: "true"
                    - name: MONGO_TLS_INSECURE
                      value: "true"
                    - name: MONGO_SECRET_DIR
                      value: "/etc/secrets/mongo"
                    - name: MODEL_PATH
                      value: "/mnt/model/best_replica_predictor_model.h5"
                    - name: BEST_MSE_FILE
                      value: "/mnt/model/best_mse.txt"
                    - name: SCALER_FILE
                      value: "/mnt/model/scaler.json"
                  volumeMounts:
                    - name: model-pv
                      mountPath: /mnt/model
                    - name: mongo-credentials
                      mountPath: /etc/secrets/mongo
                      readOnly: true
                volumes:
                  - name: model-pv
                    persistentVolumeClaim:
                      claimName: model-pvc
                  - name: mongo-credentials
                    secret:
                      secretName: mongo-credentials

# ---------------------------------------------------------------------------
# planning-agent Deployment (long-running; reads metrics → writes scaling plans)
# ---------------------------------------------------------------------------

- name: Deploying planning-agent
  kubernetes.core.k8s:
    definition:
      kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-planning-agent'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        replicas: "{{ size }}"
        selector:
          matchLabels:
            app: masa-agent-planning
        template:
          metadata:
            labels:
              app: masa-agent-planning
          spec:
            serviceAccountName: masa-controller-manager
            containers:
            - name: masa-agent-planning
              image: "jpksn/masa-agent-planning:1.0.2"            # masa-agent-planning/docker
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              env:
                - name: MONGO_HOST
                  value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                - name: MONGO_TLS
                  value: "true"
                - name: MONGO_TLS_INSECURE
                  value: "true"
                - name: MONGO_SECRET_DIR
                  value: "/etc/secrets/mongo"
                - name: MODEL_PATH
                  value: "/mnt/model/best_replica_predictor_model.h5"
                - name: SCALER_FILE
                  value: "/mnt/model/scaler.json"
                - name: DEPLOYMENT_NAME
                  value: "{{ microservice_deployment | default('iotoccupancy-sample-mosquitto') }}"
                - name: NAMESPACE
                  value: "{{ microservice_namespace | default(ansible_operator_meta.namespace) }}"
                # Prediction loop interval (seconds). governance_context takes precedence
                # for deployment/namespace; env vars are the fallback.
                - name: PREDICT_INTERVAL_SECONDS
                  value: "30"
              volumeMounts:
                - name: model-pv
                  mountPath: /mnt/model
                - name: mongo-credentials
                  mountPath: /etc/secrets/mongo
                  readOnly: true
            volumes:
              - name: model-pv
                persistentVolumeClaim:
                  claimName: model-pvc
              - name: mongo-credentials
                secret:
                  secretName: mongo-credentials

# ---------------------------------------------------------------------------
# reflection-agent CronJob (runs every 5 minutes, concurrencyPolicy: Forbid)
# ---------------------------------------------------------------------------

- name: Deploying reflection-agent CronJob
  kubernetes.core.k8s:
    definition:
      kind: CronJob
      apiVersion: batch/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-reflection-agent'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        # Evaluate autoscaler quality every 5 minutes.
        schedule: "{{ qa_schedule | default('*/5 * * * *') }}"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            template:
              metadata:
                labels:
                  app: masa-agent-reflection
              spec:
                serviceAccountName: masa-controller-manager
                restartPolicy: OnFailure
                containers:
                - name: masa-agent-reflection
                  image: "jpksn/masa-agent-reflection:1.0.3"      # masa-agent-reflection/docker
                  imagePullPolicy: Always
                  resources:
                    requests:
                      cpu: "200m"
                      memory: "512Mi"
                    limits:
                      cpu: "1000m"
                      memory: "1Gi"
                  ports:
                    - containerPort: 8000
                      name: metrics
                      protocol: TCP
                  env:
                    - name: NAMESPACE
                      value: "{{ microservice_namespace | default(ansible_operator_meta.namespace) }}"
                    - name: DEPLOYMENT_NAME
                      value: "{{ microservice_deployment | default('iotoccupancy-sample-mosquitto') }}"
                    - name: MONGO_HOST
                      value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                    - name: MONGO_TLS
                      value: "true"
                    - name: MONGO_TLS_INSECURE
                      value: "true"
                    - name: MONGO_SECRET_DIR
                      value: "/etc/secrets/mongo"
                    - name: MODEL_PATH
                      value: "/mnt/model/best_replica_predictor_model.h5"
                    - name: SCALER_FILE
                      value: "/mnt/model/scaler.json"
                    - name: BEST_MSE_FILE
                      value: "/mnt/model/best_mse.txt"
                    - name: QA_STATE_FILE
                      value: "/mnt/model/qa_state.json"
                    - name: METRICS_PORT
                      value: "8000"
                    # How long (seconds) to keep the metrics HTTP server alive after evaluation
                    # so Prometheus has time to scrape before the pod exits.
                    - name: METRICS_HOLD_SECONDS
                      value: "30"
                  volumeMounts:
                    - name: model-pv
                      mountPath: /mnt/model
                    - name: mongo-credentials
                      mountPath: /etc/secrets/mongo
                      readOnly: true
                volumes:
                  - name: model-pv
                    persistentVolumeClaim:
                      claimName: model-pvc
                  - name: mongo-credentials
                    secret:
                      secretName: mongo-credentials

# ---------------------------------------------------------------------------
# reflection-agent metrics Service (allows Prometheus to scrape the CronJob pod)
# ---------------------------------------------------------------------------

- name: Create reflection-agent metrics Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: '{{ ansible_operator_meta.name }}-reflection-agent-metrics'
        namespace: '{{ ansible_operator_meta.namespace }}'
        labels:
          app: masa-agent-reflection
      spec:
        selector:
          app: masa-agent-reflection
        ports:
          - name: metrics
            port: 8000
            targetPort: 8000
            protocol: TCP

# ---------------------------------------------------------------------------
# ServiceMonitor – lets the cluster Prometheus scrape reflection-agent metrics
# (requires the prometheus-operator CRD to be installed in the cluster)
# ---------------------------------------------------------------------------

- name: Create reflection-agent ServiceMonitor
  kubernetes.core.k8s:
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: '{{ ansible_operator_meta.name }}-reflection-agent'
        namespace: '{{ ansible_operator_meta.namespace }}'
        labels:
          app: masa-agent-reflection
          # Standard label used by the OpenShift / cluster-monitoring stack to
          # pick up ServiceMonitors in non-openshift namespaces.
          openshift.io/cluster-monitoring: "true"
      spec:
        selector:
          matchLabels:
            app: masa-agent-reflection
        endpoints:
          - port: metrics
            interval: 60s
            # QA pod exits after METRICS_HOLD_SECONDS (30 s default).
            # A short scrape interval would miss the window, so we scrape
            # 10 s after the job starts to capture at least one sample.
            scrapeTimeout: 25s
        namespaceSelector:
          matchNames:
            - '{{ ansible_operator_meta.namespace }}'

# ---------------------------------------------------------------------------
# dashboard Deployment
# ---------------------------------------------------------------------------

- name: Deploying dashboard
  kubernetes.core.k8s:
    definition:
      kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: '{{ ansible_operator_meta.name }}-dashboard'
        namespace: '{{ ansible_operator_meta.namespace }}'
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: masa-dashboard
        template:
          metadata:
            labels:
              app: masa-dashboard
          spec:
            serviceAccountName: masa-controller-manager
            containers:
            - name: masa-dashboard
              image: "jpksn/masa-dashboard:1.0.1"
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 8080
                protocol: TCP
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              env:
                - name: MONGO_HOST
                  value: "mas-mongo-ce-0.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-1.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017,mas-mongo-ce-2.mas-mongo-ce-svc.mongoce.svc.cluster.local:27017"
                - name: MONGO_TLS
                  value: "true"
                - name: MONGO_TLS_INSECURE
                  value: "true"
                - name: MONGO_SECRET_DIR
                  value: "/etc/secrets/mongo"
                - name: WINDOW_MINUTES
                  value: "60"
              volumeMounts:
                - name: mongo-credentials
                  mountPath: /etc/secrets/mongo
                  readOnly: true
            volumes:
              - name: mongo-credentials
                secret:
                  secretName: mongo-credentials

# ---------------------------------------------------------------------------
# dashboard Service
# ---------------------------------------------------------------------------

- name: Create dashboard Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: '{{ ansible_operator_meta.name }}-dashboard'
        namespace: '{{ ansible_operator_meta.namespace }}'
        labels:
          app: masa-dashboard
      spec:
        selector:
          app: masa-dashboard
        ports:
          - name: http
            port: 8080
            targetPort: 8080
            protocol: TCP

# ---------------------------------------------------------------------------
# dashboard Route (OpenShift) — exposes the dashboard externally
# ---------------------------------------------------------------------------

- name: Create dashboard Route
  kubernetes.core.k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: '{{ ansible_operator_meta.name }}-dashboard'
        namespace: '{{ ansible_operator_meta.namespace }}'
        labels:
          app: masa-dashboard
      spec:
        to:
          kind: Service
          name: '{{ ansible_operator_meta.name }}-dashboard'
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
