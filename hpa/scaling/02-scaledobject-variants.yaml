#       metricType: AverageValue
#       metadata:
#         serverAddress: https://thanos-querier.openshift-monitoring.svc:9091
#         namespace: iotoccupancy
#         metricName: mqtt_total_message_rate
#         query: >-
#           sum(rate(mqtt_delivered_messages_total{job="mqtt-load-tester-metrics"}[1m]))
#           + sum(rate(mqtt_undelivered_messages_total{job="mqtt-load-tester-metrics"}[1m]))
#         threshold: "300"
#         authModes: bearer
#         unsafeSsl: "true"
#       authenticationRef:
#         name: thanos-trigger-auth
#   advanced:
#     horizontalPodAutoscalerConfig:
#       behavior:
#         scaleUp:
#           stabilizationWindowSeconds: 0
#           selectPolicy: Max
#           policies:
#             - type: Percent
#               value: 100
#               periodSeconds: 15
#             - type: Pods
#               value: 4
#               periodSeconds: 15
#         scaleDown:
#           stabilizationWindowSeconds: 60
#           selectPolicy: Min
#           policies:
#             - type: Percent
#               value: 25
#               periodSeconds: 30
#             - type: Pods
#               value: 2
#               periodSeconds: 30
#
# ---------------------------------------------------------------------------
