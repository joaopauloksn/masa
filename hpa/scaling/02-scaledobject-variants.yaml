# Sensitivity-analysis variants for the KEDA + HPA baseline.
#
# EVERYTHING IN THIS FILE IS COMMENTED OUT ON PURPOSE and the file is NOT listed
# in kustomization.yaml.  The baseline (01-scaledobject.yaml) must remain the
# only active ScaledObject for the iotoccupancy-sample-mosquitto Deployment:
# two ScaledObjects targeting the same workload fight over the same HPA and
# KEDA rejects the second one.
#
# To run a variant:
#   1. oc delete scaledobject iotoccupancy-sample-mosquitto-scaler -n iotoccupancy
#   2. Uncomment ONE variant document below (strip the leading "# ").
#   3. oc apply -f ginga/hpa/scaling/02-scaledobject-variants.yaml
#   4. Run the 30-minute benchmark, collect the CSV, then delete the variant and
#      re-apply the baseline (oc apply -k ginga/hpa/scaling/).
#
# Baseline reference: T = 400 msg/s/pod, desired = ceil(M / T).
#
#   +-----------+------------+------------------------------------------------+
#   | Variant   | Threshold  | Expected behaviour                             |
#   +-----------+------------+------------------------------------------------+
#   | A         | T = 300    | Conservative: more pods per msg/s, earlier     |
#   |           |            | scale-up, lower latency, higher cost.          |
#   | baseline  | T = 400    | Reference profile (mirrors MASA matrix).       |
#   | B         | T = 500    | Aggressive: fewer pods, cheaper, risk of SLA   |
#   |           |            | breach (P90 latency) at load peaks.            |
#   | C         | T = 400 +  | Composite: throughput OR P90 latency drives    |
#   |           | P90 <= 0.85|  scaling; HPA uses the max of both metrics.    |
#   +-----------+------------+------------------------------------------------+
#
# Replica count examples (M = total msg/s):
#   M = 1200 -> A: 4, baseline: 3, B: 3
#   M = 3000 -> A: 10, baseline: 8, B: 6
#   M = 6000 -> A: 20 -> capped at 15, baseline: 15, B: 12
#
# ---------------------------------------------------------------------------
# Variant A - conservative (T = 300)
# ---------------------------------------------------------------------------
# apiVersion: keda.sh/v1alpha1
# kind: ScaledObject
# metadata:
#   name: iotoccupancy-sample-mosquitto-scaler
#   namespace: iotoccupancy
#   labels:
#     app.kubernetes.io/part-of: keda-hpa-baseline
#     app.kubernetes.io/component: scaling
#     keda-hpa-baseline/variant: t300-conservative
