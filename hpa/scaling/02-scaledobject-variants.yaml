# ---------------------------------------------------------------------------
# Variant C - composite throughput + P90 latency trigger
# ---------------------------------------------------------------------------
# Two triggers: the HPA evaluates each metric independently and scales to the
# LARGEST desired replica count.
#   - Trigger 1: same throughput trigger as the baseline (T = 400 msg/s/pod).
#   - Trigger 2: P90 delivery latency (seconds), same expression MASA's
#     perception agent uses (monitor.py get_quantile_90).  Latency is a
#     cluster-level quantity, NOT additive per pod, so it uses
#     metricType: Value (compared as-is, not divided by replica count):
#       desired = ceil(currentReplicas * P90 / threshold)
#     threshold 0.85 s = upper edge of MASA's "loaded, within SLA" band
#     (SLA target_quantile_90 = 1.0 s).
#
# apiVersion: keda.sh/v1alpha1
# kind: ScaledObject
# metadata:
#   name: iotoccupancy-sample-mosquitto-scaler
#   namespace: iotoccupancy
#   labels:
#     app.kubernetes.io/part-of: keda-hpa-baseline
#     app.kubernetes.io/component: scaling
#     keda-hpa-baseline/variant: composite-latency
# spec:
#   scaleTargetRef:
#     apiVersion: apps/v1
#     kind: Deployment
#     name: iotoccupancy-sample-mosquitto
#   minReplicaCount: 1
