#           + sum(rate(mqtt_undelivered_messages_total{job="mqtt-load-tester-metrics"}[1m]))
#         threshold: "400"
#         authModes: bearer
#         unsafeSsl: "true"
#       authenticationRef:
#         name: thanos-trigger-auth
#     - type: prometheus
#       metricType: Value
#       metadata:
#         serverAddress: https://thanos-querier.openshift-monitoring.svc:9091
#         namespace: iotoccupancy
#         metricName: mqtt_delivery_latency_p90_seconds
#         query: >-
#           histogram_quantile(0.90, sum(rate(mqtt_message_delivery_time_seconds_histogram_bucket{job="mqtt-load-tester-metrics"}[1m])) by (le))
#         threshold: "0.85"
#         # Return 0 instead of failing when no samples exist (idle / no traffic).
#         ignoreNullValues: "true"
#         authModes: bearer
#         unsafeSsl: "true"
#       authenticationRef:
#         name: thanos-trigger-auth
#   advanced:
