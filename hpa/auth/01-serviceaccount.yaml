---
# ServiceAccount used exclusively by the KEDA Prometheus scaler to authenticate
# against the in-cluster OpenShift Thanos Querier
# (https://thanos-querier.openshift-monitoring.svc:9091).
#
# OpenShift 4.11+ no longer auto-generates long-lived token secrets for
# ServiceAccounts.  We create an explicit Secret of type
# kubernetes.io/service-account-token and annotate it so the token controller
# populates it with a signed bearer token.  The Secret name
# (keda-thanos-reader-token) is referenced by 03-trigger-auth.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-thanos-reader
  namespace: iotoccupancy
  labels:
    app.kubernetes.io/part-of: keda-hpa-baseline
    app.kubernetes.io/component: auth

---
# Long-lived bearer token secret for the keda-thanos-reader ServiceAccount.
# The annotation causes the OpenShift token controller to inject the signed JWT
# into .data.token automatically after the Secret is created.
#
# NOTE: Long-lived tokens carry elevated risk compared to projected short-lived
# tokens.  Rotate or replace with a projected token volume if your security
# policy requires it.  For the purposes of this research baseline the
# long-lived token simplifies the KEDA SecretTargetRef configuration.
apiVersion: v1
kind: Secret
metadata:
  name: keda-thanos-reader-token
  namespace: iotoccupancy
  annotations:
    kubernetes.io/service-account.name: keda-thanos-reader
  labels:
    app.kubernetes.io/part-of: keda-hpa-baseline
    app.kubernetes.io/component: auth
type: kubernetes.io/service-account-token
